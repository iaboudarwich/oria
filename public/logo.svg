    <!-- CENTRAL FIGURE -->
    <circle cx="50" cy="39" r="4.8" fill="#0f0f0f"/>
    <path d="M 40.5 58 C 40.5 45.5, 59.5 45.5, 59.5 58 Z" fill="#0f0f0f"/>

  </g>

  <!-- WORDMARK below the icon -->
  <text
    x="512"
    y="935"
    text-anchor="middle"
    font-family="Newsreader, Georgia, serif"
    font-size="180"
    font-weight="400"
    letter-spacing="-6"
    fill="#0f0f0f"
    font-variation-settings="'opsz' 72"
  >Oria</text>

</svg>
