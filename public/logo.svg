    <g transform="translate(20 47)">
      <circle r="2.3" fill="#0f0f0f"/>
      <path d="M -3.4 5.4 C -3.4 2.3, 3.4 2.3, 3.4 5.4 L 3.4 6.1 L -3.4 6.1 Z" fill="#0f0f0f"/>
    </g>

    <g transform="translate(24 30) rotate(-12)">
      <path d="M 0 0 L 5.5 0 L 7.2 1.7 L 7.2 7.2 L 0 7.2 Z" fill="#0f0f0f"/>
      <path d="M 5.5 0 L 5.5 1.7 L 7.2 1.7 Z" fill="#efe9dc"/>
      <line x1="1" y1="3" x2="6" y2="3" stroke="#efe9dc" stroke-width="0.4"/>
      <line x1="1" y1="4.1" x2="6" y2="4.1" stroke="#efe9dc" stroke-width="0.4"/>
      <line x1="1" y1="5.2" x2="4.8" y2="5.2" stroke="#efe9dc" stroke-width="0.4"/>
      <line x1="1" y1="6.3" x2="4" y2="6.3" stroke="#efe9dc" stroke-width="0.35"/>
    </g>

    <g transform="translate(36 22)">
      <circle r="2.3" fill="#0f0f0f"/>
      <path d="M -3.4 5.4 C -3.4 2.3, 3.4 2.3, 3.4 5.4 L 3.4 6.1 L -3.4 6.1 Z" fill="#0f0f0f"/>
    </g>

    <g transform="translate(46 17)">
      <rect width="8" height="5.5" rx="0.4" fill="#0f0f0f"/>
      <path d="M 0.5 0.5 L 4 2.8 L 7.5 0.5" stroke="#efe9dc" stroke-width="0.55" fill="none"/>
      <line x1="1.1" y1="3.8" x2="5.4" y2="3.8" stroke="#efe9dc" stroke-width="0.3"/>
      <line x1="1.1" y1="4.6" x2="4.2" y2="4.6" stroke="#efe9dc" stroke-width="0.3"/>
      <rect x="6.2" y="0.8" width="1.2" height="1" fill="#efe9dc" opacity="0.7"/>
    </g>

    <g transform="translate(64 22)">
      <circle r="2.3" fill="#0f0f0f"/>
      <path d="M -3.4 5.4 C -3.4 2.3, 3.4 2.3, 3.4 5.4 L 3.4 6.1 L -3.4 6.1 Z" fill="#0f0f0f"/>
    </g>

    <g transform="translate(70 30) rotate(14)">
      <rect width="5.5" height="8" rx="0.4" fill="#0f0f0f"/>
      <line x1="0.6" y1="1.3" x2="4.9" y2="1.3" stroke="#efe9dc" stroke-width="0.4"/>
      <line x1="1.1" y1="2.1" x2="4.4" y2="2.1" stroke="#efe9dc" stroke-width="0.3"/>
      <circle cx="2.75" cy="4.4" r="1.1" fill="none" stroke="#efe9dc" stroke-width="0.4"/>
      <circle cx="2.75" cy="4.4" r="0.3" fill="#efe9dc"/>
      <line x1="0.6" y1="6.6" x2="4.9" y2="6.6" stroke="#efe9dc" stroke-width="0.35"/>
    </g>

    <g transform="translate(80 47)">
      <circle r="2.3" fill="#0f0f0f"/>
      <path d="M -3.4 5.4 C -3.4 2.3, 3.4 2.3, 3.4 5.4 L 3.4 6.1 L -3.4 6.1 Z" fill="#0f0f0f"/>
