<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Beige background -->
  <rect width="1024" height="1024" fill="#f5f1ea"/>

  <!-- ICON: positioned at top, scaled to 720px -->
  <g transform="translate(152 50) scale(7.2)">

    <defs>
      <clipPath id="vesselClip"><circle cx="50" cy="50" r="38"/></clipPath>
    </defs>

    <!-- THE BOUNDARY RING -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#0f0f0f" stroke-width="2.4"/>

    <!-- VESSEL FILL -->
    <rect x="12" y="58" width="76" height="32" fill="#0f0f0f" clip-path="url(#vesselClip)"/>

    <!-- VESSEL ITEMS -->

    <!-- Document -->
    <g transform="translate(22 63) rotate(-8)">
      <path d="M 0 0 L 6 0 L 8 2 L 8 8 L 0 8 Z" fill="#efe9dc"/>
      <path d="M 6 0 L 6 2 L 8 2 Z" fill="#0f0f0f"/>
      <line x1="1" y1="3.2" x2="6.6" y2="3.2" stroke="#0f0f0f" stroke-width="0.4"/>
      <line x1="1" y1="4.3" x2="6.6" y2="4.3" stroke="#0f0f0f" stroke-width="0.4"/>
      <line x1="1" y1="5.4" x2="5.4" y2="5.4" stroke="#0f0f0f" stroke-width="0.4"/>
      <line x1="1" y1="6.5" x2="4.2" y2="6.5" stroke="#0f0f0f" stroke-width="0.4"/>
      <circle cx="6.5" cy="6.5" r="0.6" fill="none" stroke="#0f0f0f" stroke-width="0.3"/>
    </g>

    <!-- Passport -->
    <g transform="translate(32 66) rotate(6)">
      <rect width="5.5" height="8" rx="0.4" fill="#efe9dc"/>
      <line x1="0.6" y1="1.3" x2="4.9" y2="1.3" stroke="#0f0f0f" stroke-width="0.4"/>
      <line x1="1.1" y1="2.1" x2="4.4" y2="2.1" stroke="#0f0f0f" stroke-width="0.3"/>
      <circle cx="2.75" cy="4.4" r="1.1" fill="none" stroke="#0f0f0f" stroke-width="0.35"/>
      <circle cx="2.75" cy="4.4" r="0.3" fill="#0f0f0f"/>
      <line x1="0.6" y1="6.6" x2="4.9" y2="6.6" stroke="#0f0f0f" stroke-width="0.35"/>
    </g>

    <!-- Envelope -->
    <g transform="translate(42 64) rotate(-3)">
      <rect width="9" height="6" rx="0.4" fill="#efe9dc"/>
      <path d="M 0.5 0.5 L 4.5 3.2 L 8.5 0.5" stroke="#0f0f0f" stroke-width="0.45" fill="none"/>
      <line x1="1" y1="4.2" x2="6" y2="4.2" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="1" y1="5" x2="4.5" y2="5" stroke="#0f0f0f" stroke-width="0.3"/>
      <rect x="6.8" y="0.8" width="1.6" height="1.4" fill="#0f0f0f" opacity="0.7"/>
    </g>

    <!-- Calendar -->
    <g transform="translate(53 66) rotate(4)">
      <rect y="1" width="7" height="6" rx="0.4" fill="#efe9dc"/>
      <rect x="1.4" y="0" width="0.8" height="2" fill="#efe9dc"/>
      <rect x="4.8" y="0" width="0.8" height="2" fill="#efe9dc"/>
      <line x1="0.5" y1="2.8" x2="6.5" y2="2.8" stroke="#0f0f0f" stroke-width="0.35"/>
      <circle cx="1.5" cy="4" r="0.25" fill="#0f0f0f"/>
      <circle cx="3" cy="4" r="0.25" fill="#0f0f0f"/>
      <circle cx="4.5" cy="4" r="0.25" fill="#0f0f0f"/>
      <circle cx="6" cy="4" r="0.25" fill="#0f0f0f"/>
      <rect x="2.6" y="4.9" width="0.9" height="0.9" fill="#0f0f0f"/>
      <circle cx="1.5" cy="5.3" r="0.25" fill="#0f0f0f"/>
      <circle cx="4.5" cy="5.3" r="0.25" fill="#0f0f0f"/>
      <circle cx="6" cy="5.3" r="0.25" fill="#0f0f0f"/>
    </g>

    <!-- Credit card -->
    <g transform="translate(62 64) rotate(-6)">
      <rect width="9" height="6" rx="0.7" fill="#efe9dc"/>
      <rect y="1.1" width="9" height="0.7" fill="#0f0f0f"/>
      <rect x="0.7" y="2.7" width="1.4" height="1" rx="0.15" fill="#0f0f0f"/>
      <line x1="2.6" y1="3.3" x2="8.2" y2="3.3" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="0.7" y1="4.5" x2="3.5" y2="4.5" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="0.7" y1="5.1" x2="2.8" y2="5.1" stroke="#0f0f0f" stroke-width="0.3"/>
    </g>

    <!-- Receipt -->
    <g transform="translate(73 65) rotate(8)">
      <path d="M 0 0 L 4 0 L 4 7 L 3 8 L 2 7 L 1 8 L 0 7 Z" fill="#efe9dc"/>
      <line x1="0.5" y1="1.4" x2="3.5" y2="1.4" stroke="#0f0f0f" stroke-width="0.5"/>
      <line x1="0.5" y1="2.6" x2="3" y2="2.6" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="0.5" y1="3.4" x2="3.2" y2="3.4" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="0.5" y1="4.2" x2="2.7" y2="4.2" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="0.5" y1="5" x2="3.4" y2="5" stroke="#0f0f0f" stroke-width="0.3"/>
      <line x1="0.5" y1="6.2" x2="3.5" y2="6.2" stroke="#0f0f0f" stroke-width="0.55"/>
